# cheap-llm-stack — llama-swap configuration
# Target: Orange Pi Zero 3W (Allwinner A733, 2x Cortex-A76 2.0 GHz + 6x Cortex-A55 1.79 GHz, 12 GB LPDDR5)
#
# Design rules (measured, see README):
#   * generation threads = 2 (one per A76); batch/prefill threads = 8 (all cores). Never raise -t above 2.
#   * KV cache is quantized to q8_0 (needs --flash-attn on) => half the KV footprint.
#   * context 16384 for the MoE. Allocating context is nearly free on this model: it
#     has attention KV in only 6 of its 24 layers (the other 18 are gated shortconv
#     with a constant-size state), so 4096 -> 40960 moved the anonymous set by
#     4705 -> 4881 MB (4.8 MB per 1000 tokens) with pp/tg unchanged (34.3/9.03 t/s
#     at a 1.5k-token prompt at every ctx size). 12288 -> 16384 costs +19 MB.
#     What is *not* free is filling it: prefill 34.3 t/s at 1.5k prompt tokens,
#     23.4 at 5.7k, 17.0 at 9.6k; decode 9.0 -> 6.0 -> 4.8 t/s on the same points.
#     So 16384 buys an agent client room for tool results, and a full window is a
#     6-10 minute turn — the reason tool results are capped at 6000 chars upstream.
#   * the text workhorse is a Mixture-of-Experts (LFM2.5-8B-A1B): 8.3B total weights but
#     only ~1.5B active per token, so it decodes at ~10.4 tok/s — faster than the dense 2B
#     (6.3 tok/s) and better on every blind-graded prompt. On a bandwidth-bound board MoE
#     is a free win.
#   * the same MoE is the tool-calling model: 7/7 on the 7-case OpenAI-style battery
#     (5 tools, parallel calls, negative case) at reasoning_budget_tokens=32, 17.9 s per
#     call. Its predecessor LFM2-8B-A1B scored 1/7 — it never emitted tool_calls at all.
#     Budget 0 is NOT usable: the thinking then leaks into `content` (5/7, 52 s/call).
#   * one VLM covers images: LFM3-VL-2B reads the same invoice text as Qwen3-VL-2B in
#     24 s vs 113 s and takes 1.25 GB instead of 2.4 GB. It replaces both the old
#     Qwen3.5-2B "assistant" and the Qwen3-VL-2B "vision-docs".
#   * resident set: embedding + 0.6B + MoE ≈ 6.5 GB, leaving several GB of page cache
#     for the VLM so a swap is seconds, not a microSD read.
#   * never swap the embedding model: it is in the "core" group with persistent: true.

healthCheckTimeout: 300          # first load from microSD can take a while
logLevel: info
logToStdout: both
# llama-swap itself listens on :10001 (see systemd unit), so the backend
# llama-server children must start above it or they collide on the bind.
startPort: 10101
globalConcurrencyLimit: 4

macros:
  models_dir: /opt/cheap-llm-stack/models
  llama_bin: /opt/cheap-llm-stack/bin/llama-server
  gen_args: --flash-attn on --jinja --no-webui
  # 2 threads = one per Cortex-A76 (generation is memory-bandwidth bound);
  # 8 batch threads across both clusters maximises prefill.
  # parallel 1: llama.cpp allocates one compute-buffer set per slot, and this board
  # serves one request at a time. The default of 4 cost ~1 GB per model (measured:
  # Qwen3-0.6B 1.79 GB -> 0.96 GB, Qwen3.5-2B 3.53 GB -> 2.4 GB). That is what makes
  # four resident models + the MoE fit in 12 GB. One slot also keeps the prompt cache
  # for the tool schema block alive between turns, which is what makes agent clients
  # usable here (a 1k-token tools+system prefix cost 43 s cold, 4-6 s warm).
  thr_args: --threads 2 --threads-batch 8 --parallel 1
  # Vision models are the exception: the image encoder (mmproj/ViT) runs on the
  # same thread pool and it dominates the cost — 181 image tokens took 48 s at
  # -t 2 (3.7 tok/s). All eight cores cut that ~3x, and for a 2B model generation
  # does not suffer (measured 6.67 tok/s at -t 8 vs 6.29 at -t 2).
  vis_args: --threads 8 --threads-batch 8 --parallel 1
  kv_args: --cache-type-k q8_0 --cache-type-v q8_0

routing:
  router:
    use: group
    settings:
      groups:
        # Always resident (swap:false = all members run together, persistent = never evicted).
        # exclusive:false so that loading the VLM never unloads this group.
        #   embedding 0.7 GB + router 1.0 GB + reasoner ~4.7 GB at 16k ctx
        core:
          swap: false
          exclusive: false
          persistent: true
          members:
            - embedding-model
            - router
        # The text workhorses swap with each other: the MoE (4.8 GB) and the
        # quality tier (5.7 GB) do not fit together in 12 GB alongside the core
        # pair (1.7 GB), and a persistent group can never be evicted, so the MoE
        # lives here instead of in `core`. ttl: 0 keeps it loaded; only a
        # deliberate request to `bolt` unloads it, and the next MoE request
        # reloads it (~100 s cold, seconds when the page cache is still warm).
        text:
          swap: true
          exclusive: false
          persistent: false
          members:
            - reasoner
            - bolt
        # The VLM is one-at-a-time and loads on demand: its vision buffers are the
        # largest anonymous allocation after the MoE, and keeping it resident too
        # pushed this board into zram swap in an earlier iteration.
        heavy:
          swap: true
          exclusive: false
          persistent: false
          members:
            - vision

# No `hooks.on_startup.preload` here, on purpose.
#
# The three core models must never be cold: measured, the first "ciao" after a
# reboot spent 141 s waiting for the 0.6B to load instead of 13 s with its weights
# in page cache. But llama-swap's preload is the wrong tool for it. It is
# implemented as a synthetic `GET /` routed to the model, and the status of that
# GET is what it reports as success (upstream internal/server/api.go:
# startPreload). Our llama.cpp is built with -DLLAMA_USE_PREBUILT_UI=OFF and has
# no `/` route, so every startup logged
#     [ERROR] failed to preload model <id>: status 404
# with the model loaded and healthy — a permanent false alarm in the only monitor
# this board has. Reproduced against a stub upstream: health passes, GET / -> 404,
# preload declared failed. Enabling the UI to satisfy the probe would add a
# Hugging Face download to every weekly rebuild.
#
# Warming is done by the router instead (router/llm_router.py, warm_loop): a
# 1-token request per core model through llama-swap, at boot and every time the
# llama-swap process is replaced. The preload hook cannot do that second part, and
# the weekly rebuild restarts llama-swap.

models:

  # ---------------------------------------------------------------- mandatory ---
  embedding-model:
    name: "Qwen3-Embedding-0.6B · always online · 4k"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-Embedding-0.6B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 4096 --batch-size 1024 --ubatch-size 512
      ${kv_args}
      --embedding --pooling last
      --alias embedding-model
      --load-mode mmap+mlock
    ttl: 0
    aliases:
      - embedding
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      embeddings: true

  # ------------------------------------------------------------- fast tier ---
  # LFM3-1.7B (dense, new tri-hybrid backbone: 13 gated shortconv + 5 sliding-window
  # + 6 global attention layers, 256K trained context). Measured against the Qwen3-0.6B
  # it replaces: pp512 t2 41.4 / t8 62.9 vs 16.4 / ~92, decode 10.1 tok/s at t2 — i.e.
  # the same decode as the 8B MoE with 1.8x the prefill and 1/4.5 the RAM, so a
  # one-line answer costs ~4 s instead of 1 s but is coherent and the 1 GB resident
  # set is the same as the 0.6B's. Native tool calling too (7/8 on the 8-case battery
  # at Q4_0, 8/8 at Q8_0, which costs 40 % decode) — the router still keeps tool turns
  # on the MoE because 8/8 at 10.4 tok/s beats 7/8. Thinking on, budget 32: the
  # template thinks by default and the doc says leave it on.
  router:
    name: "LFM3-1.7B · fast tier · chitchat + one-liners"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/LFM3-1.7B-QAD-Q4_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 8192 ${kv_args}
      ${gen_args}
      --reasoning on --reasoning-budget 32
      --alias router
      --load-mode mmap
    ttl: 0
    aliases:
      - fast
      - tiny
      - lfm3
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # The 0.6B stays installed and addressable, not resident: it answers a 40-token
  # chitchat reply in 1.05 s where anything bigger needs seconds, so it is the tool
  # to reach for when latency matters more than prose. It must never see a tool
  # request: it does emit tool_calls (7/7) but mangles the arguments.
  router-0.6b:
    name: "Qwen3-0.6B · 1 s chitchat · optional"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-0.6B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ubatch-size 256
      --ctx-size 6144 ${kv_args}
      ${gen_args}
      --reasoning off
      --alias router-0.6b
      --load-mode mmap
    ttl: 300
    aliases:
      - tiny-0.6b
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # ------------------------------------------- text workhorse + agent (MoE) ---
  # LFM2.5-8B-A1B: 8.3B total / ~1.5B active. Decodes at ~10.4 tok/s (dense 2B: 6.3,
  # dense 4B: 2.9) and won the blind-graded quality battery, so it is the default for
  # every non-trivial text request.
  # --reasoning-budget 32 is the measured sweet spot for tool calling: 7/7 in 17.9 s
  # per call, versus 7/7 in 24.1 s at 96 and 5/7 at 0 (where the thinking spills into
  # `content`). The router also raises temperature to 0.6 on tool turns: a cold
  # sampler answers a tool request in prose instead of emitting the call (0.2 scored
  # 5/7 whatever the budget, 0.6 scored 7/7). The router overrides the rest per
  # request (route `reason` gets 256) and
  # keeps it bounded for plain chat so `content` never carries the monologue.
  # ttl 0: this model must never be evicted — a cold load costs ~100 s of microSD and
  # an eviction also throws away the tool-schema prompt cache. (An earlier `ttl: 1800`
  # silently unloaded it in the middle of the night.)
  reasoner:
    name: "LFM2.5-8B-A1B (MoE) · text + tools · 10.4 tok/s"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/LFM2.5-8B-A1B-Q4_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --reasoning on --reasoning-budget 32
      --alias reasoner
      --load-mode mmap
    ttl: 0
    aliases:
      - default
      - moe
      - lfm2
      - agent
      - tools
      - assistant
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # ------------------------------------------------- quality tier (opt-in) ---
  # NVIDIA-Nemotron-3.5-Bolt-E4B-4GB (gemma4 arch, 7.52 B params, Q4_K_M imatrix,
  # 5.74 GiB, 64k trained context, vision mmproj available separately).
  # Measured here, llama-bench, this board: pp512 8.07 t/s at -t 2 (13.15 at -t 8),
  # tg32 2.91 t/s at -t 2 (2.70 at -t 8) — i.e. ~3.5x slower than the MoE, because
  # it is dense per token: the "E4B" is about *embedding* params (per-layer input
  # embeddings, 2560 d + 256 per layer over 42 blocks), not about sparse compute.
  # Measured through llama-server, cold load 105 s:
  #   * tool call, 3-tool surface, thinking off:   correct call in 21.7 s (19 tok)
  #   * synthesis from a web_search result:        calls web_url_read instead of
  #                                                answering (26.4 s) — same reflex
  #                                                as the MoE, so the router's loop
  #                                                guard handles both
  #   * same turn with the tools withdrawn:        correct 167-token answer, 73.3 s
  #   * thinking on (chat_template_kwargs.enable_thinking), budget 32 honoured:
  #                                                64.6 s for 140 tok
  #   * "chi è Gerry Scotti?" with no tool result: HALLUCINATES (journalist and
  #                                                writer) — it must not answer
  #                                                facts from memory
  # So it is not a default: 5.74 GiB evicts the MoE and every answer costs 3x.
  # It is a deliberate tier (`model: bolt|quality|deep`) for a hard question, with
  # ttl 900 so it unloads itself, AND `auto` escalates to it: ROUTER_DEEP_TIER=1
  # (set in llm-router.service) sends a long (>600 chars) reasoning request there
  # on the first turn of a session and pins that session to it (`sticky-deep`).
  # Measured through the router: 411.8 s for one 800-token deep answer, 265.1 s
  # without tools, 290.5 s for the tool-result turn; the way back to the MoE is
  # a ~100 s swap, so the pinning matters more than the escalation itself.
  bolt:
    name: "Nemotron-3.5-Bolt-E4B · quality, auto on long reasoning · 2.9 tok/s"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Nemotron-3.5-Bolt-E4B-Q4_K_M.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --reasoning on --reasoning-budget 32
      --alias bolt
      --load-mode mmap
    ttl: 900
    aliases:
      - quality
      - deep
      - nemotron
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # ------------------------------------------------------- vision (VLM) ---
  # LFM3-VL-2B: one model for descriptions, OCR, tables and screenshots.
  # Measured against the two it replaces on the same invoice: identical OCR text in
  # 24.0 s vs 113.4 s (Qwen3-VL-2B) and 24.8 s vs 145.7 s (Qwen3.5-2B) for a
  # description, at 1.25 GB of weights instead of ~2.4 GB per model.
  # It also handles tools (6/7 on the battery), which is what lets an agent client
  # attach an image *and* tools to the same turn.
  # Budget 32 keeps the answer in `content`: with reasoning disabled the model leaks
  # its monologue ("The user asks: ...") into the reply.
  vision:
    name: "LFM3-VL-2B · images / OCR / screenshots · on demand"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/LFM3-VL-2B-QAD-Q4_0.gguf
      --mmproj ${models_dir}/mmproj-LFM3-VL-2B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${vis_args}
      --ctx-size 6144 ${kv_args}
      ${gen_args}
      --reasoning on --reasoning-budget 32
      --alias vision
      --load-mode mmap
    ttl: 900
    aliases:
      - vlm
      - ocr
      - vision-docs
      - vision-ocr
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
