# cheap-llm-stack — llama-swap configuration
# Target: Orange Pi Zero 3W (Allwinner A733, 2x Cortex-A76 2.0 GHz + 6x Cortex-A55 1.79 GHz, 12 GB LPDDR5)
#
# Design rules (measured, see README):
#   * generation threads = 2 (one per A76); batch/prefill threads = 8 (all cores). Never raise -t above 2.
#   * KV cache is quantized to q8_0 (needs --flash-attn on) => half the KV footprint.
#   * context is sized to what this board can actually prefill: an 8k prompt costs
#     ~5 minutes of prefill at 25 tok/s, so bigger windows would only burn RAM.
#     The MoE is full-attention, which makes its KV expensive (~150 KB/token q8):
#     8k ctx keeps it at ~1.2 GB; 16k would have cost 2.4 GB and pushed the board
#     into zram swap (measured: 5 GB anon for the MoE at 16k).
#   * the text workhorse is a Mixture-of-Experts (LFM2-8B-A1B): 8B total weights but only
#     1.1B active per token, so it decodes at 10.7 tok/s — faster than the dense 2B (6.3 tok/s)
#     and better on every blind-graded prompt. On a bandwidth-bound board MoE is a free win.
#   * resident set: embedding + the MoE ≈ 5.7 GB, leaving ~3.5 GB of page cache for the
#     cold models (router / assistant / vision-docs) so a swap is seconds, not a microSD read.
#   * no 4B tier: see the note before the vision specialist. At 2.9 tok/s every thinking
#     request cost 170 s, and using it evicted the MoE, which then needed ~120 s to return.
#   * never swap the embedding model: it is in the "core" group with persistent: true.

healthCheckTimeout: 300          # first load from microSD can take a while
logLevel: info
logToStdout: both
# llama-swap itself listens on :10001 (see systemd unit), so the backend
# llama-server children must start above it or they collide on the bind.
startPort: 10101
globalConcurrencyLimit: 4

macros:
  models_dir: /opt/cheap-llm-stack/models
  llama_bin: /opt/cheap-llm-stack/bin/llama-server
  gen_args: --flash-attn on --jinja --no-webui
  # 2 threads = one per Cortex-A76 (generation is memory-bandwidth bound);
  # 8 batch threads across both clusters maximises prefill.
  # parallel 1: llama.cpp allocates one compute-buffer set per slot, and this board
  # serves one request at a time. The default of 4 cost ~1 GB per model (measured:
  # Qwen3-0.6B 1.79 GB -> 0.96 GB, Qwen3.5-2B 3.53 GB -> 2.4 GB). That is what makes
  # four resident models + the 5 GB MoE fit in 12 GB.
  thr_args: --threads 2 --threads-batch 8 --parallel 1
  # Vision models are the exception: the image encoder (mmproj/ViT) runs on the
  # same thread pool and it dominates the cost — 181 image tokens took 48 s at
  # -t 2 (3.7 tok/s). All eight cores cut that ~3x, and for a 2B model generation
  # does not suffer (measured 6.67 tok/s at -t 8 vs 6.29 at -t 2).
  vis_args: --threads 8 --threads-batch 8 --parallel 1
  kv_args: --cache-type-k q8_0 --cache-type-v q8_0

routing:
  router:
    use: group
    settings:
      groups:
        # Always resident (swap:false = all members run together, persistent = never evicted).
        # exclusive:false so that loading a heavy model never unloads this group.
        core:
          swap: false
          exclusive: false
          persistent: true
          members:
            - embedding-model
            - reasoner
        # Everything else is one-at-a-time and loads on demand. Measured anon cost
        # (not reclaimable) is what decides this split:
        #   reasoner 4.9 GB, assistant 2.1 GB, vision-docs 2.4 GB, router-0.6b 0.9 GB
        # MoE + embedding resident (5.7 GB) leaves room for one heavy model with real
        # headroom; keeping the 0.6B and a VLM resident too meant 8.7 GB of anon,
        # 5.4 GB of zram swap and 226 MB available — the kernel then swapped the
        # router out entirely and 2 GB of the MoE's KV with it.
        heavy:
          swap: true
          exclusive: false
          persistent: false
          members:
            - router-0.6b
            - assistant
            - vision-docs

hooks:
  on_startup:
    # Only what must never be cold: the mandatory embedding model and the MoE
    # workhorse. The fast tier and the two VLMs load on first use (their weights
    # stay in page cache, so that costs seconds, not a 100 s microSD read).
    preload:
      - embedding-model
      - reasoner

models:

  # ---------------------------------------------------------------- mandatory ---
  embedding-model:
    name: "Qwen3-Embedding-0.6B · always online · 8k"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-Embedding-0.6B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 4096 --batch-size 1024 --ubatch-size 512
      ${kv_args}
      --embedding --pooling last
      --alias embedding-model
      --load-mode mmap+mlock
    ttl: 0
    aliases:
      - embedding
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      embeddings: true

  # ------------------------------------------------------------- fast tier ---
  # Tiny model for one-line answers: 16.8 tok/s vs 10.7 for the MoE, i.e. ~2 s saved
  # on a 60-token reply. That is not worth 1.5 GB of permanent RAM on a 12 GB board,
  # so it is a heavy-group member: loaded on the first trivial request and kept
  # (ttl 0) until a vision request swaps it out.
  router-0.6b:
    name: "Qwen3-0.6B · fast tier · 16.8 tok/s"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-0.6B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ubatch-size 256
      --ctx-size 4096 ${kv_args}
      ${gen_args}
      --reasoning off
      --alias router-0.6b
      --load-mode mmap
    ttl: 0
    aliases:
      - fast
      - tiny
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # ---------------------------------------------------- vision workhorse (VLM) ---
  # Qwen3.5 is natively multimodal: one 2B covers images and text. It lives in the
  # heavy group because its vision buffers alone are 2 GB of anonymous memory, and
  # 2 GB of VLM + 5 GB of MoE + the two 0.6B models does not fit in 12 GB (measured:
  # 390 MB left, 5.4 GB forced into zram). First picture after a reboot pays a load.
  assistant:
    name: "Qwen3.5-2B · text+vision · on demand"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3.5-2B-UD-Q4_K_XL.gguf
      --mmproj ${models_dir}/mmproj-Qwen3.5-2B-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      ${vis_args}
      --ctx-size 8192 ${kv_args}
      ${gen_args}
      --reasoning off
      --alias assistant
      --load-mode mmap
    ttl: 600
    aliases:
      - qwen3.5-2b
      - vlm
      - vision
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true

  # ------------------------------------------------------ text workhorse (MoE) ---
  # LFM2-8B-A1B: 8.4B total / 1.1B active. Decodes at 10.7 tok/s (dense 2B: 6.3,
  # dense 4B: 2.9) and won 5 of 6 blind-graded prompts against both, so it is the
  # default for every non-trivial text request and it is never evicted.
  # Measured: 4.96 GB anon + 4.93 GB mapped file at ctx 2048, i.e. the MoE keeps a
  # copy of its expert tensors in anonymous memory, so mmap does not make it cheap
  # to reload. That is why it is preloaded and persistent: a cold load is ~100 s.
  reasoner:
    name: "LFM2-8B-A1B (MoE) · text workhorse · 10.7 tok/s"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/LFM2-8B-A1B-Q4_K_M.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 8192 ${kv_args}
      ${gen_args}
      --alias reasoner
      --load-mode mmap
    ttl: 1800
    aliases:
      - default
      - moe
      - lfm2
      - auto
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # No "big thinking" tier on purpose. A 4B dense model decodes at 2.9 tok/s here
  # and a 2B at ~6 tok/s, so any request that reasons before answering costs 80-170 s
  # no matter how the budget is set (measured: 4B + budget 256 = 170 s; 2B + budget 96
  # still produced 500 tokens = 83 s). On a board nobody will sit and wait for, that
  # is not a tier, it is a trap — and every use of it evicts the MoE, which then needs
  # ~120 s to come back from microSD. The MoE answers the same questions correctly in
  # ~11 s without a visible thinking pass, so it simply *is* the quality tier.

  # ------------------------------------------------------- vision specialist ---
  # Dedicated VLM for OCR, tables, screenshots, diagrams. Not preloaded:
  # it is chosen only when the router detects a document-grade image task.
  vision-docs:
    name: "Qwen3-VL-2B · OCR / documents / screenshots"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-VL-2B-Instruct-UD-Q4_K_XL.gguf
      --mmproj ${models_dir}/mmproj-Qwen3-VL-2B-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      ${vis_args}
      --ctx-size 8192 ${kv_args}
      ${gen_args}
      --reasoning off
      --alias vision-docs
    ttl: 900
    aliases:
      - ocr
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
