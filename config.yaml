# cheap-llm-stack — llama-swap configuration
# Target: Orange Pi Zero 3W (Allwinner A733, 2x Cortex-A76 2.0 GHz + 6x Cortex-A55 1.79 GHz, 12 GB LPDDR5)
#
# Design rules (measured, see README):
#   * generation threads = 2 (one per A76); batch/prefill threads = 8 (all cores). Never raise -t above 2.
#   * KV cache is quantized to q8_0 (needs --flash-attn on) => 16k ctx costs ~0.9 GB instead of ~1.9 GB.
#   * resident set is small on purpose: embedding + 0.6B router + one 2B model ≈ 5 GB,
#     leaving ~6 GB for page cache, so unloaded models reload in <2 s instead of ~40 s from the SD card.
#   * never swap the embedding model: it is in the "core" group with persistent: true.

healthCheckTimeout: 300          # first load from microSD can take a while
logLevel: info
logToStdout: both
startPort: 10001
globalConcurrencyLimit: 4

macros:
  models_dir: /opt/cheap-llm-stack/models
  llama_bin: /opt/cheap-llm-stack/bin/llama-server
  # 2 generation threads on the A76 cluster; 8 batch threads for prefill (measured +35..60% pp).
  gen_args: --threads 2 --threads-batch 8 --flash-attn on --jinja --no-webui
  kv_args: --cache-type-k q8_0 --cache-type-v q8_0

routing:
  router:
    use: group
    settings:
      groups:
        # Always resident. persistent:true => llama-swap may never evict these.
        core:
          swap: false
          exclusive: false
          persistent: true
          members:
            - embedding-model
            - router-0.6b
        # Heavy/frontier models: one at a time. Cheap to swap because the weights stay
        # in the page cache (mmap), so a "reload" is a few hundred ms, not a disk read.
        llm:
          swap: true
          exclusive: false
          persistent: false
          members:
            - assistant
            - assistant-large
            - vision-docs

hooks:
  on_startup:
    # All four fit in 12 GB at once (≈6.5 GB weights+KV with q8_0), so a swap
    # becomes a no-op instead of a 40-70 s SD read. vision-docs stays cold.
    preload:
      - embedding-model
      - router-0.6b
      - assistant
      - assistant-large

models:

  # ---------------------------------------------------------------- mandatory ---
  embedding-model:
    name: "Qwen3-Embedding-0.6B · always online · 8k"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-Embedding-0.6B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      --threads 2 --threads-batch 8
      --ctx-size 8192 --batch-size 2048 --ubatch-size 512
      ${kv_args}
      --embedding --pooling last
      --alias embedding-model
      --mlock
    ttl: 0
    aliases:
      - embedding
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      embeddings: true

  # ------------------------------------------------------------- fast tier ---
  # Tiny model kept warm: classification, short answers, rewrite/cleanup, router fallback.
  router-0.6b:
    name: "Qwen3-0.6B · fast tier / classifier"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-0.6B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      --threads 2 --threads-batch 8
      --ctx-size 8192 ${kv_args}
      ${gen_args}
      --alias router-0.6b
      --mlock
    ttl: 0
    aliases:
      - fast
      - tiny
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # -------------------------------------------------- default workhorse (VLM) ---
  # Qwen3.5 is natively multimodal => one resident model covers text AND vision.
  assistant:
    name: "Qwen3.5-2B · text+vision · default"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3.5-2B-UD-Q4_K_XL.gguf
      --mmproj ${models_dir}/mmproj-Qwen3.5-2B-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      --threads 2 --threads-batch 8
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --alias assistant
      --mlock
    ttl: 0
    aliases:
      - default
      - qwen3.5-2b
      - vision
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true

  # ------------------------------------------------------- quality escalation ---
  assistant-large:
    name: "Qwen3.5-4B · reasoning/code escalation · text+vision"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3.5-4B-UD-Q4_K_XL.gguf
      --mmproj ${models_dir}/mmproj-Qwen3.5-4B-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      --threads 2 --threads-batch 8
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --alias assistant-large
      --mlock
    ttl: 1800
    aliases:
      - big
      - qwen3.5-4b
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true

  # ------------------------------------------------------- vision specialist ---
  # Dedicated VLM for OCR, tables, screenshots, diagrams. Not preloaded:
  # it is chosen only when the router detects a document-grade image task.
  vision-docs:
    name: "Qwen3-VL-2B · OCR / documents / screenshots"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-VL-2B-Instruct-UD-Q4_K_XL.gguf
      --mmproj ${models_dir}/mmproj-Qwen3-VL-2B-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      --threads 2 --threads-batch 8
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --alias vision-docs
    ttl: 900
    aliases:
      - ocr
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
