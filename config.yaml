# cheap-llm-stack — llama-swap configuration
# Target: Orange Pi Zero 3W (Allwinner A733, 2x Cortex-A76 2.0 GHz + 6x Cortex-A55 1.79 GHz, 12 GB LPDDR5)
#
# Design rules (measured, see README):
#   * generation threads = 2 (one per A76); batch/prefill threads = 8 (all cores). Never raise -t above 2.
#   * KV cache is quantized to q8_0 (needs --flash-attn on) => 16k ctx costs ~0.9 GB instead of ~1.9 GB.
#   * the text workhorse is a Mixture-of-Experts (LFM2-8B-A1B): 8B total weights but only
#     1.1B active per token, so it decodes at 10.7 tok/s — faster than the dense 2B (6.3 tok/s)
#     and better on every blind-graded prompt. On a bandwidth-bound board MoE is a free win.
#   * resident set: embedding + 0.6B router + 2B VLM + the MoE ≈ 9 GB, leaving page cache
#     for the cold models (deep / vision-docs) so a swap is seconds, not a 40 s microSD read.
#   * never swap the embedding model: it is in the "core" group with persistent: true.

healthCheckTimeout: 300          # first load from microSD can take a while
logLevel: info
logToStdout: both
# llama-swap itself listens on :10001 (see systemd unit), so the backend
# llama-server children must start above it or they collide on the bind.
startPort: 10101
globalConcurrencyLimit: 4

macros:
  models_dir: /opt/cheap-llm-stack/models
  llama_bin: /opt/cheap-llm-stack/bin/llama-server
  gen_args: --flash-attn on --jinja --no-webui
  # 2 threads = one per Cortex-A76 (generation is memory-bandwidth bound);
  # 8 batch threads across both clusters maximises prefill.
  # parallel 1: llama.cpp allocates one compute-buffer set per slot, and this board
  # serves one request at a time. The default of 4 cost ~1 GB per model (measured:
  # Qwen3-0.6B 1.79 GB -> 0.96 GB, Qwen3.5-2B 3.53 GB -> 2.4 GB). That is what makes
  # four resident models + the 5 GB MoE fit in 12 GB.
  thr_args: --threads 2 --threads-batch 8 --parallel 1
  kv_args: --cache-type-k q8_0 --cache-type-v q8_0

routing:
  router:
    use: group
    settings:
      groups:
        # Always resident (swap:false = all members run together, persistent = never evicted).
        # exclusive:false so that loading a heavy model never unloads this group.
        core:
          swap: false
          exclusive: false
          persistent: true
          members:
            - embedding-model
            - router-0.6b
            - assistant
        # Heavy models: swap:true = only one member runs at a time. That is what keeps
        # 12 GB safe: the largest (5.6 GB MoE) or the cold pair, never both.
        heavy:
          swap: true
          exclusive: false
          persistent: false
          members:
            - reasoner
            - deep
            - vision-docs

hooks:
  on_startup:
    # Everything a normal turn needs is already hot: embeddings, the 0.6B fast tier,
    # the VLM (vision) and the MoE workhorse. deep/vision-docs stay cold on purpose.
    preload:
      - embedding-model
      - router-0.6b
      - assistant
      - reasoner

models:

  # ---------------------------------------------------------------- mandatory ---
  embedding-model:
    name: "Qwen3-Embedding-0.6B · always online · 8k"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-Embedding-0.6B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 8192 --batch-size 1024 --ubatch-size 512
      ${kv_args}
      --embedding --pooling last
      --alias embedding-model
      --load-mode mmap+mlock
    ttl: 0
    aliases:
      - embedding
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      embeddings: true

  # ------------------------------------------------------------- fast tier ---
  # Tiny model kept warm: one-line answers, classification, rewrite/cleanup.
  # 16.8 tok/s ≈ 1.6x the MoE, so it is still worth having for trivial turns.
  router-0.6b:
    name: "Qwen3-0.6B · fast tier · 16.8 tok/s"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-0.6B-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 8192 ${kv_args}
      ${gen_args}
      --reasoning off
      --alias router-0.6b
      --load-mode mmap+mlock
    ttl: 0
    aliases:
      - fast
      - tiny
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # ---------------------------------------------------- vision workhorse (VLM) ---
  # Qwen3.5 is natively multimodal, so ONE resident 2B covers images + text.
  # Keeping it in the core group means a picture is answered instantly, with no swap.
  assistant:
    name: "Qwen3.5-2B · text+vision · always resident"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3.5-2B-UD-Q4_K_XL.gguf
      --mmproj ${models_dir}/mmproj-Qwen3.5-2B-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --reasoning off
      --alias assistant
      --load-mode mmap+mlock
    ttl: 0
    aliases:
      - qwen3.5-2b
      - vlm
      - vision
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true

  # ------------------------------------------------------ text workhorse (MoE) ---
  # LFM2-8B-A1B: 8.4B total / 1.1B active. Decodes at 10.7 tok/s (dense 2B: 6.3,
  # dense 4B: 2.9) and won 5 of 6 blind-graded prompts against both, so it is the
  # default for every non-trivial text request.
  # load-mode mmap (not mlock): its 5 GB stay reclaimable, so the cold models and the
  # page cache can still use RAM if they need it.
  reasoner:
    name: "LFM2-8B-A1B (MoE) · text workhorse · 10.7 tok/s"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/LFM2-8B-A1B-Q4_K_M.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --alias reasoner
      --load-mode mmap
    ttl: 1800
    aliases:
      - default
      - moe
      - lfm2
      - auto
    checkEndpoint: /health
    capabilities:
      in: [text]
      out: [text]
      tools: true

  # --------------------------------------------------- deliberate deep thinking ---
  # Qwen3.5-4B with thinking ON but capped. Measured: unconstrained thinking ran 349
  # tokens for 17*23 (~2 min at 2.9 tok/s); the budget keeps it near 90 s and the
  # budget-message stops the model mid-thought instead of truncating it.
  # Never selected automatically — ask for it with model "deep".
  deep:
    name: "Qwen3.5-4B · thinking (budget 256) · text+vision · 2.9 tok/s"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3.5-4B-UD-Q4_K_XL.gguf
      --mmproj ${models_dir}/mmproj-Qwen3.5-4B-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --reasoning on --reasoning-budget 256
      --reasoning-budget-message "Stop thinking and give the final answer now."
      --alias deep
      --load-mode mmap
    ttl: 1800
    aliases:
      - assistant-large
      - qwen3.5-4b
      - think
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true

  # ------------------------------------------------------- vision specialist ---
  # Dedicated VLM for OCR, tables, screenshots, diagrams. Not preloaded:
  # it is chosen only when the router detects a document-grade image task.
  vision-docs:
    name: "Qwen3-VL-2B · OCR / documents / screenshots"
    cmd: >
      ${llama_bin}
      -m ${models_dir}/Qwen3-VL-2B-Instruct-UD-Q4_K_XL.gguf
      --mmproj ${models_dir}/mmproj-Qwen3-VL-2B-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      ${thr_args}
      --ctx-size 16384 ${kv_args}
      ${gen_args}
      --reasoning off
      --alias vision-docs
    ttl: 900
    aliases:
      - ocr
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
